# Based partially on Alyxia's work, thanks so much!

name: Release
on:
  push:
    tags:
      - v*

env:
  FORCE_COLOR: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-v3-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libsdl2-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libglx-dev libgl1-mesa-dev libxxf86vm-dev libglfw3-dev libwayland-dev libwayland-egl1 libegl-dev libxkbcommon-dev wayland-protocols extra-cmake-modules

      - name: Install Go dependencies
        run: go get -v

      - name: Recreate vendor and apply Wayland patches
        run: |
          go mod vendor
          git apply patches/wayland.patch

      - name: Build GUI (X11)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags static -ldflags "-s
          -w -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short
          HEAD)' -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o
          TrashCordInstaller-x11

      - name: Build GUI (Wayland)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "static wayland"
          -ldflags "-s -w -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerGitHash=$(git
          rev-parse --short HEAD)' -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerTag=${{
          github.ref_name }}'" -o TrashCordInstaller-wayland

      - name: Build GUI (Combined)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "static combined"
          -ldflags "-s -w -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerGitHash=$(git
          rev-parse --short HEAD)' -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerTag=${{
          github.ref_name }}'" -o TrashCordInstaller

      - name: Build CLI
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "cli" -ldflags "-s
          -w -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short
          HEAD)' -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o
          TrashCordInstallerCli-linux

      - name: Update executable
        run: |
          chmod +x TrashCordInstaller*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TrashCordInstaller-linux
          path: |
            TrashCordInstaller-x11
            TrashCordInstaller-wayland
            TrashCordInstaller
            TrashCordInstallerCli-linux

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-arm64-go-v3-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-arm64-go-

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libsdl2-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libglx-dev libgl1-mesa-dev libxxf86vm-dev libglfw3-dev libwayland-dev libwayland-egl1 libegl-dev libxkbcommon-dev wayland-protocols extra-cmake-modules

      - name: Install Go dependencies
        run: go get -v

      - name: Recreate vendor and apply Wayland patches
        run: |
          go mod vendor
          git apply patches/wayland.patch

      - name: Build GUI (X11)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags static -ldflags "-s -w -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o TrashCordInstaller-x11-arm64

      - name: Build GUI (Wayland)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags "static wayland" -ldflags "-s -w -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o TrashCordInstaller-wayland-arm64

      - name: Build GUI (Combined)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags "static combined" -ldflags "-s -w -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o TrashCordInstaller-arm64

      - name: Build CLI
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags "cli" -ldflags "-s -w -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o TrashCordInstallerCli-linux-arm64

      - name: Update executable
        run: |
          chmod +x TrashCordInstaller*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TrashCordInstaller-linux-arm64
          path: |
            TrashCordInstaller-x11-arm64
            TrashCordInstaller-wayland-arm64
            TrashCordInstaller-arm64
            TrashCordInstallerCli-linux-arm64

  build-mac:
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            artifact_name: TrashCordInstaller-macos
            dmg_name: TrashCordInstaller-x64.dmg
          - arch: arm64
            runner: macos-15
            artifact_name: TrashCordInstaller-macos-arm64
            dmg_name: TrashCordInstaller-arm64.dmg

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-${{ matrix.arch }}-go-v3-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-go-

      - name: Install dependencies
        run: brew install sdl2 create-dmg

      - name: Install Go dependencies
        run: go get -v

      - name: Build DMG
        run: |
          make ARCH=${{ matrix.arch }} GUI=1 DMG=1 VERSION=${{ github.ref_name }}
          mv build/TrashCordInstaller.dmg ${{ matrix.dmg_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dmg_name }}

  build-mac-dmg:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-universal-go-v3-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-universal-go-

      - name: Install dependencies
        run: brew install sdl2 create-dmg

      - name: Install Go dependencies
        run: go get -v

      - name: Build universal DMG
        run: make ARCH=universal GUI=1 DMG=1 VERSION=${{ github.ref_name }}

      - name: Build CLI
        run: |
          make ARCH=amd64 GUI=0 VERSION=${{ github.ref_name }}
          mv build/TrashCordInstallerCli-darwin build/TrashCordInstallerCli-x64
          make ARCH=arm64 GUI=0 VERSION=${{ github.ref_name }}
          mv build/TrashCordInstallerCli-darwin build/TrashCordInstallerCli-arm64
          make ARCH=universal GUI=0 VERSION=${{ github.ref_name }}
          mv build/TrashCordInstallerCli-darwin build/TrashCordInstallerCli-universal
          for f in build/TrashCordInstallerCli-*; do
            lipo -info "$f"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TrashCordInstaller-macos-universal
          path: |
            build/TrashCordInstaller.dmg
            build/TrashCordInstallerCli-x64
            build/TrashCordInstallerCli-arm64
            build/TrashCordInstallerCli-universal

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-go-v3-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          path-type: inherit

      - name: Install Windows dependencies
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2

      - name: Install Go dependencies
        shell: msys2 {0}
        run: |
          go get -v
          go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e  # v0.3.3

      - name: Build GUI
        shell: msys2 {0}
        run: |
          go-winres make --product-version "git-tag"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "static gui" -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o TrashCordInstaller.exe

      - name: Build CLI
        shell: msys2 {0}
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "cli" -ldflags "-s -w -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o TrashCordInstallerCli.exe
          cp TrashCordInstallerCli.exe TrashCordInstallerCli-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TrashCordInstaller-windows
          path: |
            TrashCordInstaller.exe
            TrashCordInstallerCli.exe
            TrashCordInstallerCli-x64.exe

  build-windows-arm64:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-arm64-go-v3-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-arm64-go-

      - name: Install llvm-mingw
        shell: pwsh
        run: |
          $version = "20260908"
          $sha256 = "1bcf74d06b724aeecaa6412ca85f5b26fb1da770e7cdcefa9263c9c5c3ad34b6"
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-x86_64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $sha256) { throw "llvm-mingw checksum mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\llvm-mingw-$version-ucrt-x86_64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Go dependencies
        shell: bash
        run: |
          go get -v
          go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e  # v0.3.3

      - name: Build GUI
        shell: bash
        run: |
          "$(go env GOPATH)/bin/go-winres" make --arch arm64 --product-version "git-tag"
          CGO_ENABLED=1 GOOS=windows GOARCH=arm64 CC=aarch64-w64-mingw32-clang CXX=aarch64-w64-mingw32-clang++ go build -v -tags "static gui" -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o TrashCordInstaller-arm64.exe

      - name: Build CLI
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -v -tags "cli" -ldflags "-s -w -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'github.com/TrashCord/TrashCordInstaller/buildinfo.InstallerTag=${{ github.ref_name }}'" -o TrashCordInstallerCli-arm64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TrashCordInstaller-windows-arm64
          path: |
            TrashCordInstaller-arm64.exe
            TrashCordInstallerCli-arm64.exe

  release:
    runs-on: ubuntu-latest
    needs:
      [
        build-linux,
        build-linux-arm64,
        build-mac,
        build-mac-dmg,
        build-windows,
        build-windows-arm64,
      ]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Download Linux Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TrashCordInstaller-linux
          path: linux

      - name: "Download Linux ARM64 Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TrashCordInstaller-linux-arm64
          path: linux

      - name: "Download MacOS Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TrashCordInstaller-macos
          path: macos

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TrashCordInstaller-macos-arm64
          path: macos

      - name: "Download MacOS DMG"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TrashCordInstaller-macos-universal
          path: macos

      - name: "Download Windows Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TrashCordInstaller-windows
          path: windows

      - name: "Download Windows ARM64 Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TrashCordInstaller-windows-arm64
          path: windows

      - name: Delete existing release
        run: gh release delete "${{ github.ref_name }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "This is release ${{ github.ref_name }} of TrashCordInstaller." \
            --generate-notes \
            linux/* windows/*.exe macos/*.dmg macos/*Cli*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
